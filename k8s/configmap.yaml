apiVersion: v1
kind: ConfigMap
metadata:
  name: acu-chatbot-config
  namespace: acu-chatbot
data:
  POSTGRES_DB: acuchatbot
  POSTGRES_USER: acuuser
  DB_HOST: db
  DB_PORT: "5432"
  DEBUG: "False"
  ALLOWED_HOSTS: "acu-chatbot.local,localhost,127.0.0.1"
  CSRF_TRUSTED_ORIGINS: "http://acu-chatbot.local,http://localhost"
  OLLAMA_MODEL: "llama3.1:8b"
  OLLAMA_URL: "http://ollama:11434"
  SELENIUM_URL: "http://selenium:4444/wd/hub"
  WAIT_FOR_DB: "true"
  WAIT_FOR_OLLAMA: "true"
  LOAD_SEED_DATA: "false"
  PULL_MODELS_ON_START: "false"
  SECURE_SSL_REDIRECT: "false"
