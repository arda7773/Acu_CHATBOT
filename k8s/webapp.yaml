apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: acu-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: acu-chatbot-webapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: acu-chatbot-config
            - secretRef:
                name: acu-chatbot-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: acu-chatbot
spec:
  selector:
    app: webapp
  ports:
    - name: http
      port: 8000
      targetPort: 8000
