apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acu-chatbot
  namespace: acu-chatbot
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  rules:
    - host: acu-chatbot.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 8000
