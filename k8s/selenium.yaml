apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium
  namespace: acu-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selenium
  template:
    metadata:
      labels:
        app: selenium
    spec:
      containers:
        - name: selenium
          image: seleniarm/standalone-chromium:latest
          ports:
            - containerPort: 4444
            - containerPort: 7900
          env:
            - name: SE_NODE_MAX_SESSIONS
              value: "2"
            - name: SE_SESSION_TIMEOUT
              value: "300"
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /wd/hub/status
              port: 4444
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /wd/hub/status
              port: 4444
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: selenium
  namespace: acu-chatbot
spec:
  selector:
    app: selenium
  ports:
    - name: webdriver
      port: 4444
      targetPort: 4444
    - name: vnc
      port: 7900
      targetPort: 7900
