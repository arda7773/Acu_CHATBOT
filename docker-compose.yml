services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acuchatbot}
      POSTGRES_USER: ${POSTGRES_USER:-acuuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acupassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acuuser} -d ${POSTGRES_DB:-acuchatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

  selenium:
    image: seleniarm/standalone-chromium:latest
    ports:
      - "4444:4444"
      - "7900:7900"
    shm_size: 2gb
    environment:
      - SE_NODE_MAX_SESSIONS=2
      - SE_SESSION_TIMEOUT=300
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4444/wd/hub/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  webapp:
    build: ./webapp
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - SELENIUM_URL=http://selenium:4444/wd/hub
      - DB_HOST=db
      - SCRAPE_BOLOGNA=false
      - EMBED_ON_START=false
      - USE_DJANGO_RUNSERVER=true
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      selenium:
        condition: service_healthy
    volumes:
      - ./webapp:/app
      - static_volume:/app/staticfiles

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - webapp
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static:ro

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    depends_on:
      - nginx
    command:
      - --nginx.scrape-uri=http://nginx/nginx_status

  prometheus:
    image: prom/prometheus:v2.54.1
    depends_on:
      - webapp
      - nginx-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.4
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres_data:
  ollama_data:
  static_volume:
